name: Publish kit

# Publishes this v3 kit when you push a version tag, e.g. `git tag v1.0.0 && git push --tags`.
# In v3, publishing is just `docker buildx build --push` — the frontend from the
# `# syntax=docker/sandbox-kit:3` line writes the kit annotations.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed to build linux/amd64,linux/arm64 in one invocation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Publishes to Docker Hub by default using the DOCKERHUB_USERNAME /
      # DOCKERHUB_TOKEN secrets. For a different registry (e.g. ghcr.io), set the
      # repo variables REGISTRY and REGISTRY_USER.
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'docker.io' }}
          username: ${{ vars.REGISTRY_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push kit
        run: |
          if [ -n "${{ vars.REGISTRY }}" ]; then
            TARGET="${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/my-kit"
          else
            TARGET="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          ./scripts/push-kit.sh "$TARGET" "${GITHUB_REF_NAME#v}"
