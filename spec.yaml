# sbx kit — starter template (schema v2)
#
# This is a MIXIN: it composes onto any base agent with `--kit`. Edit the fields
# below to describe your product, then publish (see README.md / PUBLISHING.md).
# Full field reference: github.com/docker/sbx-kits-contrib (spec/SPEC-v2.md).

schemaVersion: "2"
kind: mixin

# Lowercase, dash-separated. This is also the default image/artifact name.
name: my-kit
displayName: My Kit
description: >-
  One line on what this kit adds to an agent. Keep it grounded in what your
  product actually does.
licenses:
  - Apache-2.0

# Least privilege: list ONLY the hosts the sandbox must reach. Everything else
# is blocked. Add your API/package hosts here.
permissions:
  network:
    allow:
      - pypi.org
      - files.pythonhosted.org
      - github.com

# Environment variables set inside the sandbox.
environment:
  variables:
    EXAMPLE_SETTING: "value"

# What runs while building/starting the sandbox.
setup:
  # install: runs at build time, as the agent user (1000) unless you say otherwise.
  install:
    - command: pip install --break-system-packages '<your-package>'
      user: "1000"
      description: Install the package into the agent user's site-packages
  # startup: runs each time the sandbox starts (argv form). Omit if not needed.
  startup: []
  # files: content dropped into the sandbox. Prefer the files/ tree for anything large.
  files: []

# Credentials the proxy injects for you — the secret is scoped to the domains
# below and never has to be handled by the agent. Delete this block if the kit
# needs no cloud credentials (local-model kits usually don't).
#
# credentials:
#   - service: my-service
#     description: API key for <service>
#     required: true
#     apiKey:
#       name: MY_SERVICE_API_KEY
#       inject:
#         - domain: api.example.com   # must also appear in permissions.network.allow
#           scheme: bearer

# Instructions merged into the agent's context so it knows the capability exists.
agentInstructions:
  content: |
    ## My Kit

    Describe here, in the agent's voice, what is now available and how to use it —
    which packages are installed, which endpoints/keys are pre-wired, and any
    conventions the agent should follow.
